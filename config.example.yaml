# Example config for gatectl. Location: ~/.config/gatectl/config.yaml (XDG-aware), plus
# drop-ins in config.d/*.yaml merged in lexical order (maps merge, hook lists append).
# Every key is shown with its default. Durations: 0, or an integer and a unit (ms, s, m, h, d).
# Only these keys can also be set as GATECTL_<KEY>, nested keys joined with __ (for example
# GATECTL_DEFAULTS__TIMEOUT): defaults.timeout, defaults.script_timeout, defaults.record_reserve,
# agent.timeout, agent.cache_ttl, agent.max_parallel, agent.min_start_budget, retention.older_than.
# Safety keys (agent.sandbox, permission_profile, setting_sources, env_allowlist, threshold, model,
# agent.input_max_bytes, defaults.input_max_bytes), lists and structured keys cannot be set from the environment.
# Precedence: flags > per-repo override > environment > config (global file, then config.d in lexical order) > defaults.
# Schema: schemas/config.json. Rules: docs/interface.md, section Config.

# Used only for the default actor (human:<name>). null: the OS username.
me:
  name: null

# The claude-session command, a list (never a shell string). Needed only by agent checks.
session_cmd: [claude-session]

defaults:
  timeout: 60s              # total deadline for one check
  script_timeout: 20s       # default timeout of one script check
  record_reserve: 2s        # kept back from the deadline for recording and output
  input_max_bytes: 1048576  # largest accepted input (1 MiB)
  script_env_allow: [PATH, HOME, LANG, "LC_*"]  # environment variables script checks receive
  recommend:                # default for every policy's recommend
    confidence: 0.95
    max_miss_rate: 0.05

agent:
  skill: "gatectl:gate-check"  # <plugin>:<skill>; custom skills need their plugin in plugin_dirs
  plugin_dirs: []              # absolute paths of extra Claude Code plugin directories
  model: null                  # null: Claude Code's default
  permission_profile: null     # null: the bundled profile file; or an absolute path
  sandbox: required            # required, preferred or off (claude-session --sandbox levels)
  setting_sources: []          # must stay empty: gate-check reads untrusted input and claude-session refuses any source
  env_allowlist: []            # environment variables an agent session may receive
  threshold: 0.8               # an allow below this confidence becomes escalate
  timeout: 300s                # default timeout of one agent check
  cache_ttl: 10m               # reuse window for an identical input; 0 turns it off
  max_parallel: 3              # live agent runs across all gatectl processes
  min_start_budget: 30s        # least remaining budget at which an agent check may start
  input_max_bytes: 65536       # largest pretty-printed input an agent check accepts (1024 to 1048576); a larger input, or one with a line over 16 KiB, escalates

retention:
  older_than: null  # prune deletes older rows; null: prune does nothing without --older-than

# Policies: a named, ordered list of checks plus a declared input. A policy's state here is only
# its initial state: off or shadow (new policies start in shadow); enforcing, and every later change,
# goes through `gatectl set`.
# Policy keys: state, timeout, applies_when, input, checks, cache_ttl, record_input, recommend.
# Check types: script (argv list, argv[0] absolute, exit code decides), rule (field tests), agent
# (a Claude session). Reuse window: a check's cache_ttl > the policy's cache_ttl > agent.cache_ttl.
# Total deadline: --timeout > the repo override's timeout > the policy's timeout > defaults.timeout. When applies_when is false
# the gate answers allow with reason not_applicable (enforced false, so it never authorizes
# anything) and records nothing.
# applies_when example for a policy wired on a forgectl or pr-comment pre-post hook:
#   applies_when: [{path: action, op: in, value: [review, approve]}]
policies: {}
# policies:
#   auto-merge:
#     state: shadow  # off or shadow; use gatectl set to enforce
#     timeout: 60s
#     cache_ttl: 10m
#     record_input: false
#     recommend: {confidence: 0.95, max_miss_rate: 0.05}
#     input:
#       require: [repo, head_sha]
#       types: {repo: string, head_sha: string}
#       ignore: [event_id]  # volatile keys left out of the agent cache key and case identity
#     checks:
#       - {name: ci-green, type: rule, when: [{path: ci.state, op: ne, value: passing}], then: deny, else: allow}
#       - {name: scope, type: script, argv: [/usr/local/bin/check-scope], timeout: 20s, env_allow: [SCOPE_DIR]}
#       - {name: reviewer, type: agent, instruction: "Escalate if the change touches security-sensitive code.", threshold: 0.8, model: haiku, timeout: 300s, cache_ttl: 10m, sandbox: required}
#       - {name: style, type: agent, instruction_file: /etc/gatectl/style.md, skill: "my-plugin:review", setting_sources: [], env_allowlist: []}

# Per-repo overrides, keyed by repo id (host/full/project/path): any policy key except state
# replaces the global key entirely, lists included (a repo's state is its stored row). The override
# has its own fingerprint and track record.
repos: {}
# repos:
#   github.com/org/repo:
#     policies:
#       auto-merge:
#         timeout: 120s
#         checks:
#           - {name: ci-green, type: rule, when: [{path: ci.state, op: ne, value: passing}], then: deny}

# Hooks: gatectl fires post-decision, post-outcome and post-state-change. Each is a list of
# {cmd, timeout (default 30s), async (default false)}; the payload arrives as JSON on stdin.
# Hooks run after the result is printed; `check` runs hooks detached; hook stdout and stderr are
# discarded.
hooks: {}
# hooks:
#   post-state-change:
#     - {cmd: "notify-team", timeout: 30s, async: true}
